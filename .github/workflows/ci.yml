name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npx vite build
      - name: Check try-on assets
        run: |
          test -s dist/mediapipe/wasm/vision_wasm_internal.wasm
          test -s dist/models/face_landmarker.task
          test -s dist/models/selfie_multiclass_256x256.tflite
